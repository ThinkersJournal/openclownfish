[package]
name = "openclownfish-clc"
description = "OpenCL C emitter for Unpopped: lowers a neutral KernelPlan to OpenCL C source."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["opencl", "kernel", "codegen", "gpu"]
categories = ["compilers", "development-tools"]
publish = false

[features]
# OpenCL C -> IR frontend (pulls tree-sitter and the C grammar). The emitter does not need it.
default = ["parse"]
parse = ["unpopped/convert", "dep:tree-sitter", "dep:tree-sitter-cpp"]

[dependencies]
unpopped = "0.38.1"
unpopped-vocab = "0.38.1"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }

[dev-dependencies]
openclownfish.workspace = true
